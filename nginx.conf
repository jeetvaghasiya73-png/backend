server {
    listen 80;
    server_name nexora-api.yourdomain.com; # Replace with your Hostinger domain / IP

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nexora-api.yourdomain.com; # Replace with your Hostinger domain / IP

    # SSL Certificate Configuration (Let's Encrypt / Hostinger SSL)
    # ssl_certificate /etc/letsencrypt/live/nexora-api.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nexora-api.yourdomain.com/privkey.pem;

    # Gzip Compression for maximum response speed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for background workers and long queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
